<!-- Keep the version in the query string when replacing favicon artwork. -->
{% assign favicon_path = '/assets/img/favicons' | relative_url %}
{% assign favicon_version = '?v=2' %}

<link rel="icon" type="image/svg+xml" href="{{ favicon_path }}/favicon.svg{{ favicon_version }}">
<link rel="icon" type="image/png" href="{{ favicon_path }}/favicon-32x32.png{{ favicon_version }}" sizes="32x32">
<link rel="icon" type="image/png" href="{{ favicon_path }}/favicon-16x16.png{{ favicon_version }}" sizes="16x16">
<link rel="shortcut icon" href="{{ favicon_path }}/favicon.ico{{ favicon_version }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ favicon_path }}/apple-touch-icon.png{{ favicon_version }}">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ favicon_path }}/site.webmanifest{{ favicon_version }}">
{% endif %}
